<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boba Drops Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="hero">
      <svg
        class="tea"
        viewBox="0 0 1440 900"
        preserveAspectRatio="xMidYMid slice"
        role="img"
        aria-labelledby="teaTitle"
      >
       

        <defs>
         
          <filter id="bleed" x="-15%" y="-15%" width="130%" height="130%">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.018" numOctaves="4" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G" />
          </filter>

         

          


          

          <linearGradient id="teaFill" x1="0" y1="0" x2="0.1" y2="1">
            <stop offset="0%" stop-color="#ffe6d0" />
            <stop offset="35%" stop-color="#fbc7a3" />
            <stop offset="70%" stop-color="#f0a97f" />
            <stop offset="100%" stop-color="#de8a60" />
          </linearGradient>

          <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff6ec" stop-opacity="0" />
            <stop offset="45%" stop-color="#fff6ec" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#fff6ec" stop-opacity="0" />
          </linearGradient>

          <radialGradient id="pearlWash" cx="46%" cy="40%" r="52%">
            <stop offset="0%" stop-color="#3f2317" stop-opacity="0.95" />
            <stop offset="48%" stop-color="#2a150d" stop-opacity="0.88" />
            <stop offset="76%" stop-color="#1c0e08" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#1c0e08" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="pearlRim" cx="50%" cy="50%" r="50%">
            <stop offset="70%" stop-color="#1c0e08" stop-opacity="0" />
            <stop offset="88%" stop-color="#1c0e08" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#1c0e08" stop-opacity="0" />
          </radialGradient>

          
          <radialGradient id="pearlPool" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#100804" stop-opacity="0.6" />
            <stop offset="65%" stop-color="#100804" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#100804" stop-opacity="0" />
          </radialGradient>

          
          <radialGradient id="pearlGloss" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
            <stop offset="60%" stop-color="#ffffff" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <path
            id="surface"
            d="M-200 330 C 40 250 280 410 520 330 C 760 250 1000 410 1240 330 C 1360 290 1540 300 1660 340"
          />

          <path
            id="foamArea"
            d="M-200 -200 L 1660 -200 L 1660 340 C 1540 300 1360 290 1240 330 C 1000 410 760 250 520 330 C 280 410 40 250 -200 330 Z"
          />

          <g id="pearlShape" style="mix-blend-mode: multiply">
            <path
              d="M2 -100 C58 -98 100 -54 98 2 C96 58 54 100 -2 98 C-58 96 -100 54 -98 -2 C-96 -58 -52 -100 2 -100 Z"
              fill="url(#pearlWash)"
            />
            <circle r="100" fill="url(#pearlRim)" />
            <circle cx="22" cy="30" r="62" fill="url(#pearlPool)" />
            <ellipse cx="-32" cy="-40" rx="44" ry="28" transform="rotate(-28 -32 -40)" fill="url(#pearlGloss)" />
            <circle cx="-34" cy="-44" r="11" fill="#ffffff" opacity="0.3" />
          </g>
        </defs>

  
        <rect x="-200" y="-200" width="1840" height="1400" fill="url(#teaFill)" />

        <g filter="url(#wash)" style="mix-blend-mode: multiply" opacity="0.5">
          <ellipse cx="260" cy="620" rx="420" ry="300" fill="#f6b389" />
          <ellipse cx="980" cy="760" rx="520" ry="300" fill="#ffd2ae" />
          <ellipse cx="1380" cy="480" rx="300" ry="240" fill="#f2a276" />
          <ellipse cx="620" cy="860" rx="380" ry="220" fill="#e79a72" />
        </g>

      
        <use href="#foamArea" fill="#fff3e6" opacity="0.5" filter="url(#bleed)" />

       
        <g class="depth" filter="url(#ink)">
          <use href="#surface" y="8" fill="none" stroke="url(#sheen)" stroke-width="10" stroke-linecap="round" />
          <use href="#surface" y="34" fill="none" stroke="#b5613f" stroke-opacity="0.38" stroke-width="5" stroke-linecap="round" />
          <use href="#surface" y="80" fill="none" stroke="#b5613f" stroke-opacity="0.26" stroke-width="4" stroke-linecap="round" />
          <use href="#surface" y="140" fill="none" stroke="#a9532f" stroke-opacity="0.17" stroke-width="4" stroke-linecap="round" />
          <use href="#surface" y="215" fill="none" stroke="#a9532f" stroke-opacity="0.1" stroke-width="4" stroke-linecap="round" />
        </g>

       
        <g transform="rotate(-29 430 350)">
          <rect x="398" y="-290" width="64" height="640" rx="32" fill="#141010" />
        </g>

        
            <ellipse cx="442" cy="372" rx="78" ry="24" fill="#7d3f27" opacity="0.28" filter="url(#soft)" />

      
            <g class="pearl" transform="translate(170 560)">
                <g class="pearl__bob" style="--delay: -1.2s; --dur: 6.8s"><use href="#pearlShape" transform="scale(0.54)" /></g>
            </g>
        <g class="pearl" transform="translate(320 700)">
          <g class="pearl__bob" style="--delay: -2.6s; --dur: 7.4s"><use href="#pearlShape" transform="scale(0.4)" /></g>
        </g>
        <g class="pearl" transform="translate(520 470)">
          <g class="pearl__bob" style="--delay: -0.4s; --dur: 5.6s"><use href="#pearlShape" transform="scale(0.32)" /></g>
        </g>
        <g class="pearl" transform="translate(600 760)">
          <g class="pearl__bob" style="--delay: -3.1s; --dur: 8.2s"><use href="#pearlShape" transform="scale(0.46)" /></g>
        </g>
        <g class="pearl" transform="translate(720 590)">
          <g class="pearl__bob" style="--delay: -1.8s; --dur: 6.2s"><use href="#pearlShape" transform="scale(0.6)" /></g>
        </g>
        <g class="pearl" transform="translate(860 700)">
          <g class="pearl__bob" style="--delay: -0.9s; --dur: 7s"><use href="#pearlShape" transform="scale(0.38)" /></g>
        </g>
        <g class="pearl" transform="translate(980 500)">
          <g class="pearl__bob" style="--delay: -2.2s; --dur: 5.9s"><use href="#pearlShape" transform="scale(0.3)" /></g>
        </g>
        <g class="pearl" transform="translate(1080 640)">
          <g class="pearl__bob" style="--delay: -3.6s; --dur: 6.6s"><use href="#pearlShape" transform="scale(0.5)" /></g>
        </g>
        <g class="pearl" transform="translate(1230 540)">
          <g class="pearl__bob" style="--delay: -1.4s; --dur: 7.8s"><use href="#pearlShape" transform="scale(0.36)" /></g>
        </g>
        <g class="pearl" transform="translate(1330 720)">
          <g class="pearl__bob" style="--delay: -2.9s; --dur: 6.4s"><use href="#pearlShape" transform="scale(0.46)" /></g>
        </g>
        <g class="pearl" transform="translate(700 420)">
          <g class="pearl__bob" style="--delay: -0.6s; --dur: 5.2s"><use href="#pearlShape" transform="scale(0.26)" /></g>
        </g>
        <g class="pearl" transform="translate(300 820)">
          <g class="pearl__bob" style="--delay: -3.3s; --dur: 8.6s"><use href="#pearlShape" transform="scale(0.34)" /></g>
        </g>
        <g class="pearl" transform="translate(1150 830)">
          <g class="pearl__bob" style="--delay: -1.1s; --dur: 7.2s"><use href="#pearlShape" transform="scale(0.4)" /></g>
        </g>

        
      </svg>
    </header>
  </body>
</html>
