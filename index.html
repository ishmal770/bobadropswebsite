<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boba Drops Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    <header class="hero">
         <section class="hero">
        <div class="drop drop1"></div>
        <div class="drop drop2"></div>
        <div class="drop drop3"></div>
        <div class="drop drop4"></div>
        <div class="drop drop5"></div>
        <div class="drop drop6"></div>
        <div class="drop drop7"></div>
        <div class="drop drop8"></div>

        <img class="bobaimg" src="boba.png" alt="Boba!" />



        
         <p class="title">Boba Drops</p>
       
        
    </section>


    </header>
    <div class=about>
        <p class="tagline">I built this basic Boba Drops website to run a workshop for my club!</p>
    </div>
    <script>
      const hero = document.querySelector(".hero");
      const drops = document.querySelectorAll(".drop");

      const REACH = 150;
      const STRENGTH = 90;

      function pushAway(clientX, clientY) {
        drops.forEach((drop) => {
          const box = drop.getBoundingClientRect();
          const pushedX = parseFloat(drop.style.getPropertyValue("--push-x")) || 0;
          const pushedY = parseFloat(drop.style.getPropertyValue("--push-y")) || 0;

          const cx = box.left + box.width / 2 - pushedX;
          const cy = box.top + box.height / 2 - pushedY;

          const dx = cx - clientX;
          const dy = cy - clientY;
          const dist = Math.hypot(dx, dy) || 1;

          if (dist < REACH) {
            const force = (1 - dist / REACH) * STRENGTH;
            drop.style.setProperty("--push-x", (dx / dist) * force + "px");
            drop.style.setProperty("--push-y", (dy / dist) * force + "px");
          } else {
            drop.style.setProperty("--push-x", "0px");
            drop.style.setProperty("--push-y", "0px");
          }
        });
      }

      hero.addEventListener("mousemove", (e) => pushAway(e.clientX, e.clientY));
      hero.addEventListener("mouseleave", () => {
        drops.forEach((drop) => {
          drop.style.setProperty("--push-x", "0px");
          drop.style.setProperty("--push-y", "0px");
        });
      });
    </script>
    
  </body>
</html>
